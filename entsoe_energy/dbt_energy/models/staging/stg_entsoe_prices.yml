version: 2

models:

  - name: stg_entsoe_prices

    description: "Cleaned ENTSO-E electricity price data."

    columns:

      - name: timestamp
        description: "Timestamp of the electricity price observation."
        data_tests:
          - not_null

      - name: price_eur_mwh
        description: "Electricity price in EUR/MWh."
        data_tests:
          - not_null

      - name: price_date
        description: "Calendar date derived from the observation timestamp."
        data_tests:
          - not_null